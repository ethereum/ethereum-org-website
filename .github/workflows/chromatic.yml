name: Chromatic

# PRs are compared against the nearest built ancestor commit. Building dev on
# push keeps that ancestor fresh, so PRs don't inherit full-capture bails.
on:
  pull_request:
    branches: [dev, master, staging, "test/**"]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    name: Visual regression (Chromatic)
    # The required merge gate is the Chromatic App's "UI Tests" check, so the
    # job itself always exits 0.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-node

      - name: Publish to Chromatic
        uses: chromaui/action@v18.5.0
        with:
          projectToken: fee8e66c9916
          # Not named chromatic.config.json: that filename is auto-loaded by
          # both projects, and untraced without onlyChanged fails the pages job.
          configFile: chromatic.storybook.json
          # Emergency stop: set repo variable CHROMATIC_SKIP to "**". Snapshots
          # stop but the UI Tests check still passes, so PRs stay mergeable.
          # The value is a branch glob, hence a default no branch can match.
          skip: ${{ vars.CHROMATIC_SKIP || '__chromatic_skip_disabled__' }}
          exitZeroOnChanges: true
          onlyChanged: true
          # Defaults to on whenever onlyChanged is set; keep it off so debug
          # logs aren't published next to the public Storybook.
          uploadMetadata: false
          # Release-train builds were already reviewed per-PR; auto-accept them
          # as baselines.
          autoAcceptChanges: "{dev,staging,master}"
          zip: true
