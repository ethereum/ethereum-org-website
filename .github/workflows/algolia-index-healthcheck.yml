name: Algolia Crawler Health Check

# Weekly check that the DocSearch crawler is actually running and not blocked. The crawl
# runs on Algolia's servers and only emails on failure, so a blocked crawler (e.g. the
# "too many missing records" safe-reindex guard) can silently freeze site search for
# months. Runs the morning after the Friday 16:20 UTC crawl and pings Discord if the
# crawler is blocked or hasn't successfully crawled recently. See docs/site-search.md.

on:
  schedule:
    - cron: "0 9 * * SAT" # Saturday 09:00 UTC, after the Friday crawl has finished
  workflow_dispatch: # Run on demand to verify a fix

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check crawler status
        id: check
        env:
          CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          CRAWLER_NAME: ethereumorg-2
          MAX_CRAWL_AGE_DAYS: "9" # weekly schedule + buffer
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/check-crawler.mjs

      - name: Alert Discord on failure
        if: steps.check.outputs.unhealthy == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          message: ${{ steps.check.outputs.report }}
